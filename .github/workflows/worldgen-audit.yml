name: scheduled world-generation audit

on:
  schedule:
    - cron: '43 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worldgen-audit:
    name: 10,000-seed world-generation audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Audit seeds 1–10,000
        run: dotnet run --project src/CivSim.Harness -c Release -- worldgen --seed 1 --audit-seeds 10000

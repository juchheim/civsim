name: WP-E5-11 Windows B5-03 shard 16 diagnostic
on:
  push:
    branches:
      - codex/wp-e5-11-windows-debug16-20261123
permissions:
  contents: read
jobs:
  windows-shard16-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Keep canonical Git line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: campaign
      - uses: actions/checkout@v4
        with:
          ref: c3aa4e063244748ffb1f951050ded4003ce8262a
          path: source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact pinned inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'campaign/windows-parity-inputs.zip'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne 'b06e3ae028cdfbbfd24e7c790c6987ee51ec451eb2d297a2c356ceee761cabda') { throw 'Input archive hash mismatch' }
          $payload = Join-Path $env:RUNNER_TEMP 'b5-payload'
          Expand-Archive -LiteralPath $archive -DestinationPath $payload
          $expected = @{
            'numeric-e5.pack' = '564b9e77b065441fc25b6137c37e6fd71b8c349bf82638199df3beaae37c2ebe'
            'harness/CivSim.Harness.dll' = '5746fa66fefe6e52ab9f0268d6ec69004c95ec3a8a8d275d6d5f468b5704d950'
            'harness/CivSim.Sim.dll' = 'a85cc888b53ef7deb2dfe85fb49218eb62a03a0d51da620205db34ff224234bc'
            'tests/CivSim.Tests.dll' = 'ecd86123731d11a49b251f9b06e08c748ff87a626be33031e9b3d3b34e03d702'
          }
          foreach ($relative in $expected.Keys) {
            $file = Join-Path $payload $relative
            if ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() -ne $expected[$relative]) { throw "Input hash mismatch: $relative" }
          }
      - name: Run shard 16 and preserve failure evidence
        id: shard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $payload = Join-Path $env:RUNNER_TEMP 'b5-payload'
          $output = Join-Path $env:RUNNER_TEMP 'b5-shard-016-diagnostic'
          $runner = Join-Path $source 'docs/MVP/balance/tools/run_b5_03_determinism.py'
          $runArgs = @(
            '--repo-root', $source,
            '--pack', (Join-Path $payload 'numeric-e5.pack'),
            '--harness-dll', (Join-Path $payload 'harness/CivSim.Harness.dll'),
            '--sim-dll', (Join-Path $payload 'harness/CivSim.Sim.dll'),
            '--manifest', (Join-Path $source 'docs/MVP/balance/m12-e5-9-b5-03-reviewed-seeds-2026-11-16.txt'),
            '--expected-manifest-sha256', '12f313f9878c568798b32e723f1aa1783b2dbb3039bfae60749f7a279d1d9895',
            '--test-assembly', (Join-Path $payload 'tests/CivSim.Tests.dll'),
            '--expected-test-assembly-sha256', 'ecd86123731d11a49b251f9b06e08c748ff87a626be33031e9b3d3b34e03d702',
            '--test-source', (Join-Path $source 'docs/MVP/balance/tools/test_run_b5_03_determinism.py'),
            '--expected-test-source-sha256', '0233a824a7e7adb94711f813f23afd0ad502973acc3cd1da074da200d9d022e9',
            '--expected-runner-sha256', 'fac86cdd7cb2b86691d34f34da234ea2c8bcb69b7c2a1fcc45d59a10ae136618',
            '--output-root', $output,
            '--minutes', '130',
            '--expected-source-head', 'c3aa4e063244748ffb1f951050ded4003ce8262a',
            '--expected-source-tree', '5f8d7b925b9292eb01a22e42829145e4b273390d',
            '--expected-source-aggregate', '701d31e084c03e9320f0de57f61abca57c4fa566aa4fca98e6a3d9c5e3e92503',
            '--expected-pack-sha256', '564b9e77b065441fc25b6137c37e6fd71b8c349bf82638199df3beaae37c2ebe',
            '--expected-harness-sha256', '5746fa66fefe6e52ab9f0268d6ec69004c95ec3a8a8d275d6d5f468b5704d950',
            '--expected-sim-sha256', 'a85cc888b53ef7deb2dfe85fb49218eb62a03a0d51da620205db34ff224234bc',
            '--shard-count', '100',
            '--shard-index', '16',
            '--execute'
          )
          python $runner @runArgs
          $runnerExit = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "B5_RUNNER_EXIT=$runnerExit"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "output=$output"
          Write-Output "Diagnostic shard exit: $runnerExit; evidence root: $output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-b5-03-shard16-diagnostic
          path: ${{ steps.shard.outputs.output }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Preserve diagnostic exit status
        if: always()
        shell: pwsh
        run: |
          if ($env:B5_RUNNER_EXIT -and $env:B5_RUNNER_EXIT -ne '0') { exit [int]$env:B5_RUNNER_EXIT }


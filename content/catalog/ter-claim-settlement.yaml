# TER: Claim & Settlement (reach). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: TER, theme: reach, name: "Claim & Settlement", purpose: "the rules of owning land. Claim radius, claim strength, how fissioned groups choose new sites, how distant land is held, and how expansion overseas works. The lineage most directly tied to Dominion score.", anchors: "home ranges; seasonal camp circuits; boundary markers and cairns; permanent villages; daughter-village colonization (Neolithic spread); boundary stones (kudurru); city-states; provinces (Persian satrapies, Roman provinces); Greek and Phoenician colonies; manors; overseas colonies; cadastral registries; suburbanization; decolonization (1945–75); smart cities."}
projects:
  - id: TER-01
    name: Home Range
    era: 0
    type: I
    status: numeric
    requires: [WAY-01]
    effects:
      - {kind: mod, stat: claim_decay_after_a_camp_moves, op: mult, value: 0.5, note: "Claim decay after a camp moves, ×0.5"}
      - {kind: show, text: home range hatch}
      - {kind: presence, text: capped 0.5 T}
    practice: [{action: scout, share: 50}, {action: mark, share: 50}]
    flavor: This valley knows our names.
    moment: Children name every stream and hill around the camp
  - id: TER-02
    name: Camp Circuits
    era: 1
    type: M
    status: numeric
    requires: [TER-01, WAY-02]
    effects:
      - {kind: claim, text: "seasonal camp emission 50% → 75% of the band's"}
      - {kind: rule, text: camp claims never decay while the band is elsewhere}
    practice: [{action: mark, share: 50}, {action: scout, share: 50}]
    flavor: All these places are ours.
    moment: "The band returns to last year's camp; its claim never faded"

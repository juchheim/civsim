# MEC: Mechanics & Machines (craft). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: MEC, theme: craft, name: "Mechanics & Machines", purpose: "mechanical advantage and automation. Turns energy into work: cranes, mills, clocks, factories and computers. The late-game multiplier on Craft output and Insight.", anchors: "levers and rollers (prehistoric); wheel (~3500 BCE); pulley and screw (Archimedes); treadwheel crane (Roman); crank and cam (medieval); mechanical clock (~1300); precision instruments (17th–18th c.); factory system (Arkwright, 1771); interchangeable parts (~1800–1850); assembly line (1913); ENIAC (1945); integrated circuit (1958); personal computer (1970s); industrial robots (1961+)."}
projects:
  - id: MEC-01
    name: "Lever & Wedge"
    era: 1
    type: M
    status: numeric
    cost: 100
    cost_reason: "docs/MVP/28 §16: late era-1 project (prerequisite depth >= 3) costs 2x the derived cost so research slows toward the end of the age"
    requires: [WOD-02]
    effects:
      - {kind: mod, stat: heavy_object_handling, op: pct, value: 0.3, note: "Heavy-object handling, +30%"}
      - {kind: mod, stat: wood_yield, op: pct, value: 0.15, note: "Wood yield, +15% by splitting"}
    practice: [{action: build, share: 50}, {action: chop, share: 50}]
    flavor: A long enough stick moves anything.
    moment: A long pole pries a boulder from the stream
  - id: MEC-02
    name: "Rollers & Sledges"

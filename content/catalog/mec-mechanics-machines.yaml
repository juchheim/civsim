schema: 1
lineage: {code: MEC, theme: craft, name: "Mechanics & Machines", purpose: "mechanical advantage and automation. Turns energy into work: cranes, mills, clocks, factories and computers. The late-game multiplier on Craft output and Insight.", anchors: "levers and rollers (prehistoric); wheel (~3500 BCE); pulley and screw (Archimedes); treadwheel crane (Roman); crank and cam (medieval); mechanical clock (~1300); precision instruments (17th–18th c.); factory system (Arkwright, 1771); interchangeable parts (~1800–1850); assembly line (1913); ENIAC (1945); integrated circuit (1958); personal computer (1970s); industrial robots (1961+)."}

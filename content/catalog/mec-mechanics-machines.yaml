      - {kind: rule, text: "Enables chronometers (WAY-10) and textile machinery (FIB-12); parts are made at a forge from wrought iron and plate glass."}
    practice: [{action: build, share: 100}]
    flavor: "A part that fits needs no filing."
    moment: "A maker checks a gear against a gauge to a hair."
  - id: MEC-10
    name: Factory System
    era: 6
    type: I
    status: numeric
    cost: 36000
    cost_reason: "docs/MVP/38 §6 D9 and docs/MVP/28 §16: depth-3 non-keystone E6 project; 2x EraBase 12000 x I 1.5."
    requires: [MEC-09, FIB-12, SOC-12]
    effects:
      - {kind: build, structure: factory}
      - {kind: unlock_action, action: factory_work}
      - {kind: mod, stat: craft_output_per_worker, op: mult, value: 2.0, note: "in a staffed factory, scaled by the power it actually receives from the shared ledger (P)"}
      - {kind: rule, text: "A factory draws workers from the countryside (urban migration) and soots adjacent tiles; the pollution is a local state until KEY-7. KEY-7 prerequisite."}
      - {kind: rule, text: "In the sim: a town of 120 or more with a water mill, windmill or fired engine raises one factory; twelve operatives leave other work to staff it; each recipe the town runs costs 1/(1+c) of its labor, where c is the share of the crew in post times the share of their power hours the ledger has left (so x2 output per worker at full power). A working factory adds soot to its tile and the ring around it (up to 10 a tile, fading a tenth each season); each point of soot on a town's own tile adds a fiftieth to its endemic deaths, up to a fifth (P, docs/MVP/38 §5.7)."}
    practice: [{action: factory_work, share: 100}]
    flavor: "Many hands, one engine, one roof."
    moment: "A hundred looms clatter under a single drive shaft."

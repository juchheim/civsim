# TRD: Exchange & Commerce (reach). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: TRD, theme: reach, name: "Exchange & Commerce", purpose: "getting what your land lacks (tin, salt, silk, oil) without conquering it; wealth; peaceful contact; diffusion. Trade is the alternative to war for satisfying [Has: …] gates.", anchors: "gift exchange; obsidian and shell networks (~100 ka+); barter; Neolithic exchange; marketplaces; market towns; coinage (Lydia ~600 BCE); Silk Road; banking and bills of exchange (Italy, 13th c.); double-entry bookkeeping (Pacioli 1494); joint-stock companies (VOC 1602); stock exchange (Amsterdam); industrial capitalism; central banking; Bretton Woods and GATT (1944–47); e-commerce (1990s); global supply chains."}

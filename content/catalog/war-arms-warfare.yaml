schema: 1
lineage: {code: WAR, theme: reach, name: "Arms & Warfare", purpose: "taking land and stores by force, and defending them in the field. War is risky (deaths, Cohesion loss, rival alliances), but it is a legitimate path to Dominion. Posture *Raid* uses it.", anchors: "clubs and thrown stones; raiding; archery in conflict (Nataruk ~10 ka); warrior bands; bronze arms and shields; chariots (~2000 BCE); phalanx and legion; iron weapons; siege engines; knights; crossbows and longbows; gunpowder weapons (China, then 14th c. Europe); pike and musket; rifles and artillery; tanks and aircraft (WWI); nuclear weapons (1945); precision and drone warfare; UN peacekeeping (1948+)."}

# SEA: Watercraft & Seafaring (reach). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: SEA, theme: reach, name: "Watercraft & Seafaring", purpose: "crossing water. Opens islands, coasts, other continents and maritime trade. Water is the biggest barrier on the map and the fastest highway once mastered.", anchors: "rafts (Sahul crossing ≥ ~50–65 ka); hide boats; dugouts (Pesse ~8000 BCE); outriggers (Austronesian); plank boats; sail (Egypt ~3000 BCE); harbors and the Pharos (~280 BCE); galleys and triremes; keeled longships and cogs; lateen sail and sternpost rudder; caravels (15th c.); galleons; steamships (1807+); steel hulls; container ships (1956)."}

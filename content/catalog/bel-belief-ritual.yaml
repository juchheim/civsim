    effects:
      - {kind: build, structure: shrine, note: "claim +0.5 in radius 3; pilgrimage"}
      - {kind: cohesion, value: 3, note: for all settlements within 20 tiles}
    practice: [{action: ritual, share: 50}, {action: build, share: 50}]
    flavor: A place where the world is thin.
    moment: Pilgrims climb toward a shrine at dawn
  - id: BEL-06
    name: "Temples & Priesthood"
    era: 3

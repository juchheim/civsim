# BEL: Belief & Ritual (kin). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: BEL, theme: kin, name: "Belief & Ritual", purpose: "Cohesion, morale under hardship, and sacred claims on land. Myth is the social technology that lets strangers cooperate at scale. No magic: belief works through people.", anchors: "burial (Qafzeh ~100 ka; Shanidar); animism and totemism; shamanism; ancestor cults (plastered skulls, Jericho); sacred sites (Göbekli Tepe ~9500 BCE); temples and priesthoods; state cults; Axial Age philosophy (~800–200 BCE); universal religions; monasticism; pilgrimage; Reformation (1517); humanism and the Enlightenment; Universal Declaration of Human Rights (1948); pluralism."}
projects:
  - id: BEL-01
    name: "Mourning & Burial"
    era: 0
    type: I
    status: numeric
    requires: [SOC-01]
    effects:
      - {kind: unlock_action, action: bury}
      - {kind: mod, stat: cohesion_loss_per_death, op: mult, value: 0.5, note: "Cohesion loss per death, ×0.5"}
      - {kind: claim, text: "+0.3, radius 2 around burial grounds"}
    practice: [{action: ritual, share: 100}]
    flavor: They stay with us in the earth.
    moment: "A body laid in a shallow grave, red ochre and a stone tool beside it"
  - id: BEL-02
    name: "Animism & Totems"
    era: 1
    type: I
    status: numeric
    requires: [BEL-01, ART-01]
    effects:
      - {kind: cohesion, value: 3}
      - {kind: build, structure: totem}
      - {kind: claim, text: "+0.3, radius 2 around totems"}
    practice: [{action: ritual, share: 100}]
    flavor: Everything is alive and watching.
    moment: Offerings left at the foot of a great tree
  - id: BEL-03
    name: Shamanism
    era: 1
    type: R
    status: numeric
    requires: [BEL-02, MED-01]
    effects:
      - {kind: role, id: shaman, insight: 12, note: heals as MED-01}
      - {kind: rule, text: "Morale floor in famine: Cohesion never below 25"}
    practice: [{action: ritual, share: 50}, {action: heal, share: 50}]
    flavor: One of us walks between worlds.
    moment: A shaman drums at the edge of the firelight
  - id: BEL-04
    name: Ancestor Veneration
    era: 2
    type: I
    status: numeric
    requires: [BEL-03, SOC-04]
    effects:

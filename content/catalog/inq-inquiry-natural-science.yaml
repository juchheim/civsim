# INQ: Inquiry & Natural Science (reach). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: INQ, theme: reach, name: "Inquiry & Natural Science", purpose: "pushing the frontier. Reveals hidden resources (prospecting, geology), unlocks the scientific institutions that cut research costs, and provides the physics behind electricity, the atom, rockets and transistors.", anchors: "tracking (an ancient \"science\"); sky watching; stone and ore lore; Ionian natural philosophy (~600 BCE); Archimedes; Ibn al-Haytham's optics and Peregrinus on magnetism; Galileo's telescope (1609) and Copernicus; scientific method (Bacon, Galileo, Royal Society); Newton (1687); Lavoisier (1789); Faraday and Maxwell; thermodynamics; Lyell and Darwin; genetics (1900 rediscovery); relativity and quantum theory (1905–1927); fission (1938); rocketry (1926–57); transistor (1947); ecology and climate science; molecular biology (1953+)."}

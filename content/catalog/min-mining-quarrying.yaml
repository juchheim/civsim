    name: Flint Mines
    era: 2
    type: D
    status: numeric
    requires: [MIN-01, STN-08]
    effects:
      - {kind: unlock_action, action: mine_flint, note: "3 L/ws"}
    practice: [{action: mine, share: 100}]
    flavor: We dug for the best stone.
    moment: Antler picks chip at chalk at the bottom of a deep pit
  - id: MIN-03
    name: Quarrying
    era: 2
    type: D
    status: numeric

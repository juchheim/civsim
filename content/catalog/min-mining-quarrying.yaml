    practice: [{action: mine, share: 100}]
    flavor: "We followed the green vein into the dark."
    moment: "A miner is lowered on a rope into a timbered shaft, a lamp glowing below him"
  - id: MIN-05
    name: Fire-Setting
    era: 3
    type: M
    status: numeric

# MIN: Mining & Quarrying (craft). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: MIN, theme: craft, name: "Mining & Quarrying", purpose: "access to stone, ores, salt, coal and oil. Mining turns the map's hidden deposits into usable stock. A depleting deposit is a reason to expand.", anchors: "ochre mining (Lion Cave ~40 ka); flint mines (Grimes Graves ~2600 BCE); copper shafts (Timna); fire-setting; Archimedes' screw; Agricola's *De re metallica* (1556); steam pumping (1712); dynamite (1867); oil wells (1859); satellite prospecting (1972+)."}
projects:
  - id: MIN-01
    name: "Flint & Ochre Seeking"
    era: 1
    type: D
    status: numeric
    requires: [STN-05]
    effects:
      - {kind: unlock_action, action: collect_flint_ochre}
      - {kind: good, id: G-FLINT}
      - {kind: good, id: G-OCHRE}
    practice: [{action: mine, share: 50}, {action: scout, share: 50}]
    flavor: The best stone hides where few look.
    moment: A scout pockets a lump of red earth and a dark flint nodule

# AGR: Agriculture (kin). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: AGR, theme: kin, name: Agriculture, purpose: "the great food multiplier. It anchors people to land, makes settlements permanent and fuels population growth. Hosts the Till and Harvest ladders.", anchors: "cultivation (~11.5 ka, Fertile Crescent; independently in China, Mesoamerica, Andes, New Guinea, Sahel); legumes; slash-and-burn; ard (~4000 BCE); irrigation (Mesopotamia); manuring; terracing; iron sickles; heavy mouldboard plough (Roman/medieval); three-field system (~800 CE); Norfolk rotation (18th c.); seed drill (Tull 1701); reaper (1831); tractors (1890s–1920s); Green Revolution (1950s–60s); precision ag (1990s+); GM crops (1994+)."}

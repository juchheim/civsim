schema: 1
lineage: {code: DIP, theme: reach, name: "Contact & Diplomacy", purpose: "structured relations with rival civilizations: peaceful first contact, alliances, treaties, vassals and global institutions. Diplomacy lets a weaker civilization survive and lets everyone share diffusion.", anchors: "greeting rituals; hospitality norms; marriage alliances; envoys and oaths; Treaty of Kadesh (~1259 BCE); tributary systems; Delian League and confederacies; dynastic marriages; resident embassies (Renaissance Italy); Concert of Europe (1815); Geneva Conventions (1864+); League of Nations and UN; arms control (1963+); G20 and global forums; Paris Agreement (2015)."}

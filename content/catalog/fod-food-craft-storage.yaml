# FOD: Food Craft & Storage (kin). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: FOD, theme: kin, name: "Food Craft & Storage", purpose: "getting more value from food and keeping it. Storage turns seasonal surplus into year-round security, which enables sedentism, specialists and cities.", anchors: "cooking (≥ ~800 ka); smoking and drying; storage pits (Natufian); boiling in pots; beer and bread (~13 ka Raqefet; ~14 ka Shubayqa flatbread); granaries (Dhra' ~11 ka); salting; ovens; the Roman *annona*; sugar refining; canning (Appert 1810); refrigeration (1870s+); industrial processing; cold-chain logistics."}
projects:
  - id: FOD-01
    name: Cooking
    era: 0
    type: D
    status: numeric
    requires: [FIR-01]
    effects:
      - {kind: mod, stat: food_value_of_meat_roots_cereals, op: pct, value: 0.3, note: "Food value of meat, roots, cereals, +30%"}
      - {kind: hazard, cause: endemic, mult: 0.93, note: food-borne deaths fall}
      - {kind: cap, cap: food, mult: 1.10}
    practice: [{action: cook, share: 100}]
    flavor: Fire chewed our food for us.
    moment: Meat sizzling on a flat stone by the fire
  - id: FOD-02
    name: "Smoking & Drying"
    era: 1
    type: M
    status: numeric
    requires: [FOD-01, FIR-03]
    effects:
      - {kind: build, structure: drying_rack}
      - {kind: good, id: G-DRIED, note: "spoilage 10%"}
      - {kind: cap, cap: lean, mult: 1.15}
    practice: [{action: preserve, share: 100}]
    flavor: Smoke for later.
    moment: Strips of fish hang over a smoky fire
  - id: FOD-03
    name: Storage Pits
    era: 1
    type: S
    status: numeric
    requires: [FOD-02, FOR-03]
    effects:
      - {kind: build, structure: storage_pit, note: "15 R, spoilage ×0.5"}
      - {kind: cap, cap: lean, mult: 1.30}
    practice: [{action: preserve, share: 50}, {action: build, share: 50}]
    flavor: "We buried our winter, and it waited."
    moment: A lined pit filled with nuts and sealed with stones
  - id: FOD-04
    name: "Boiling & Stews"
    era: 1
    type: M

# HUS: Animal Husbandry (kin). Imported once from docs/MVP/03*.md; edit here from now on.
schema: 1
lineage: {code: HUS, theme: kin, name: Animal Husbandry, purpose: "walking food stores, draft power, wool, milk and the horse. Turns grasslands and hills into productive territory; enables nomadic expansion.", anchors: "dogs (≥ ~15 ka, possibly 30–40 ka; Goyet ~31.7 ka disputed); reindeer following; goats and sheep (~11–10 ka); cattle and pigs (~10.5 ka); dairying (~7000 BCE); wool sheep; horse (Botai ~3500 BCE; DOM2 ~2200 BCE); pastoral nomadism; camels (~1000 BCE); Bakewell's breeding (18th c.); fodder crops; vet schools (1761); refrigerated meat ships (1877–1882); feedlots; animal genomics."}
projects:
  - id: HUS-01
    name: Wolf Companions
    era: 1
    type: D
    status: numeric
    requires: [HNT-04]
    gates: [{kind: seen, target: Wolves}]
    effects:
      - {kind: good, id: G-DOG, note: "Dogs: 1 per 4 people, eat 0.3 R/season"}
      - {kind: mod, stat: hunt, op: pct, value: 0.2, note: "Hunt, +20%"}
      - {kind: mod, stat: raid_surprise, op: pct, value: -0.5, note: "Raid surprise, −50%"}
      - {kind: unlock, text: dog travois}
      - {kind: hazard, cause: predators, mult: 0.92}
    practice: [{action: hunt, share: 50}, {action: herd, share: 50}]
    flavor: The wolf chose to stay.
    moment: "A wolf pup takes meat from a child's hand"
  - id: HUS-02
    name: Herd Following
    era: 1
    type: M
    status: numeric
    requires: [HUS-01, WAY-02]
    effects:
      - {kind: method, action: herd, rung: 0, name: Herd following, mult: 2, note: "herd fear decays , drives can't push it off"}
      - {kind: cap, cap: food, mult: 1.04}
    practice: [{action: herd, share: 50}, {action: hunt, share: 50}]
    flavor: "We followed, and the herd kept us."
    moment: "Hunters walk beside a reindeer herd, not chasing it"
  - id: HUS-03
    name: "Goats & Sheep"
    era: 2
    type: D
    status: numeric
    requires: [HUS-02]
    gates: [{kind: seen, target: Wild goats or sheep}]
    effects:
      - {kind: unlock_action, action: herd, note: "tame 0.5 ws per animal; pasture carries 6"}
      - {kind: rule, text: "meat 0.8 R, hide 0.2 per animal per yr"}
      - {kind: gate, text: "[Seen: Wild goats or sheep]"}
      - {kind: build, structure: pasture, note: "holds the herd; a pasture tile carries 6 goats or sheep"}
    practice: [{action: herd, share: 100}]
    flavor: Meat that walks beside us.
    moment: A child leads a goat on a rope
  - id: HUS-04
    name: "Cattle & Pigs"
    era: 2
    type: D
    status: numeric
    requires: [HUS-03, AGR-01]
    effects:
      - {kind: unlock_action, action: herd}
      - {kind: rule, text: "cattle 2.5 R + 0.3 hide/yr; pigs 1.2 R, eat waste"}
      - {kind: unlock, project: NRG-01, text: NRG-01}
    practice: [{action: herd, share: 100}]
    flavor: "The wild bull, tamed."
    moment: An aurochs calf penned behind stakes
  - id: HUS-05
    name: Dairying
    era: 3
    type: M
    status: numeric
    requires: [HUS-04, CER-03]
    effects:
      - {kind: mod, stat: herd_food_without_slaughter, op: mult, value: 1.5, note: "half the herd's food comes as milk"}
      - {kind: good, id: G-MILK}
      - {kind: good, id: G-CHEESE, note: "5% spoilage"}
      - {kind: cap, cap: food, mult: 1.08, take: 0.5}
      - {kind: cap, cap: lean, mult: 1.05}
    practice: [{action: herd, share: 50}, {action: preserve, share: 50}]
    flavor: "Food from the living herd, every day."
    moment: "A woman milks a goat into a clay jar while cheeses hang drying in cloth"
  - id: HUS-06
    name: Wool Breeds
    era: 3
    type: M
    status: numeric
    requires: [HUS-03, FIB-06]
    effects:
      - {kind: good, id: G-WOOL, note: "0.5 L per sheep a year by shearing"}
      - {kind: good, id: G-WOOLGARMENT}
      - {kind: mod, stat: yarn_output, op: mult, value: 1.5}
      - {kind: rule, text: "a wool garment (warmth +1) stacks with a hide wrap or tailored clothing in Cold climates (clothing at most +3)"}
    practice: [{action: herd, share: 50}, {action: fiber, share: 50}]
    flavor: "The sheep grew coats for us."
    moment: "Shears flash and a whole fleece falls away in one piece"
  - id: HUS-07
    name: Horse Taming
    era: 3
    type: D
    status: numeric
    requires: [HUS-04]
    gates: [{kind: seen, target: Wild horses}]
    effects:
      - {kind: unlock_action, action: tame_horses, note: "1 ws an animal, at most 15% of a wild herd a year; a pasture carries 2"}
      - {kind: good, id: G-HORSE}
      - {kind: unlock, text: "riding (TRN-06), chariots (WAR-06)"}
      - {kind: gate, text: "[Seen: Wild horses]"}
    practice: [{action: herd, share: 100}]
    flavor: "The fastest animal on the plain came when we called."
    moment: "A youth clings to the mane of a half-wild horse circling a corral"
  - id: HUS-08
    name: Pastoral Nomadism
    era: 3
    type: I
    status: numeric
    requires: [HUS-07, TER-05]
    effects:
      - {kind: claim, text: "+1 radius on grassland, steppe and savanna tiles"}
      - {kind: rule, text: "seasonal camps follow the herds each season (best pasture within r+3) and claim at 75%"}
      - {kind: rule, text: "settlements whose range is at least half grassland, steppe or savanna pay half Overreach"}
    practice: [{action: herd, share: 50}, {action: mark, share: 50}]
    flavor: "Where the grass is, there is our home."
    moment: "A whole camp moves across the steppe behind its herds, tents lashed to horses"
  - id: HUS-09
    name: "Camels & Caravan Animals"
    era: 4
    type: D
    status: draft
    requires: [HUS-07]
    gates: [{kind: seen, target: Camels or Llamas}]
    effects:
      - {kind: prose, text: "Desert and mountain caravans: trade range across deserts ×3."}
  - id: HUS-10
    name: Selective Breeding
    era: 5
    type: M
    status: draft
    requires: [HUS-06, AGR-07]
    effects:
      - {kind: prose, text: "Herd yields ×1.5; stronger draft animals."}
  - id: HUS-11
    name: "Fodder Crops & Stall-Feeding"
    era: 6
    type: M
    status: draft
    requires: [HUS-10, AGR-11]
    effects:
      - {kind: prose, text: "Winter herds kept alive: livestock survive winter +80%; manure → field fertility."}
  - id: HUS-12
